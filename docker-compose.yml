# agents.noahsarch.tech — static landing page for the Noah's Arch agents. nginx on 127.0.0.1:8787; Cloudflare Tunnel is the only way in.
services:
  landing:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: landing
    ports: ["127.0.0.1:${LANDING_PORT:-8787}:8080"]
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: ["/tmp"]
    user: "101:101"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "2m", max-file: "2" } }
