worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type text/html;
  access_log off;            # no visitor logging
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  gzip on; gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ $uri.html =404; }
  }
}
